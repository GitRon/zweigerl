<c-vars text tone="ink" />
{# The Etikett: a short word on a small paper label, like the one on a herbarium sheet. The tone may #}
{# underline what the word says, never say it alone - the word is always the meaning. #}
<span class="inline-block rounded-sm border bg-sheet px-2 py-0.5 text-sm leading-tight font-bold {% if tone == 'forest' %}border-forest text-forest{% elif tone == 'brick' %}border-brick text-brick{% else %}border-ink text-ink{% endif %}">{{ text }}</span>
