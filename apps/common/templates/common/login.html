<c-common.layout title="Anmelden">
    <main class="mx-auto max-w-sm px-4 py-16">
        <h1 class="text-3xl font-semibold">Zweigerl</h1>
        <p class="mt-2 text-stone-600">Bitte melde dich an.</p>
        <form method="post" action="{% url 'common:login-view' %}" class="mt-8 flex flex-col gap-4">
            {% csrf_token %}
            {% if form.non_field_errors %}
                <p role="alert" class="rounded bg-red-100 px-3 py-2 text-red-800">
                    Benutzername oder Passwort stimmen nicht. Nach drei Fehlversuchen ist die Anmeldung
                    15 Minuten gesperrt.
                </p>
            {% endif %}
            <label class="flex flex-col gap-1">
                <span>Benutzername</span>
                <input class="rounded border border-stone-300 px-3 py-2" type="text" name="username"
                       autocomplete="username" required autofocus value="{{ form.username.value|default_if_none:'' }}">
            </label>
            <label class="flex flex-col gap-1">
                <span>Passwort</span>
                <input class="rounded border border-stone-300 px-3 py-2" type="password" name="password"
                       autocomplete="current-password" required>
            </label>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="rounded bg-stone-800 px-4 py-2 text-white">Anmelden</button>
        </form>
    </main>
</c-common.layout>
