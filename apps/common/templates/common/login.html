<c-common.layout title="Anmelden">
    <main class="mx-auto max-w-sm px-4 py-16">
        <h1><c-common.wordmark class="text-6xl" /></h1>
        <p class="mt-4">Bitte melde dich an.</p>
        <form method="post" action="{% url 'common:login-view' %}" class="mt-8 flex flex-col gap-5">
            {% csrf_token %}
            {% if form.non_field_errors %}
                {# What went wrong is "ziegel" - see docs/patterns/visual-identity.md. #}
                <p role="alert" class="text-ziegel">
                    Benutzername oder Passwort stimmen nicht. Nach drei Fehlversuchen ist die Anmeldung
                    15 Minuten gesperrt.
                </p>
            {% endif %}
            <label class="flex flex-col gap-1">
                <span>Benutzername</span>
                <input class="min-h-11 rounded-md border-[1.5px] border-tinte bg-blatt px-3" type="text" name="username"
                       autocomplete="username" required autofocus value="{{ form.username.value|default_if_none:'' }}">
            </label>
            <label class="flex flex-col gap-1">
                <span>Passwort</span>
                <input class="min-h-11 rounded-md border-[1.5px] border-tinte bg-blatt px-3" type="password"
                       name="password" autocomplete="current-password" required>
            </label>
            <input type="hidden" name="next" value="{{ next }}">
            <c-common.button variant="primary" type="submit">Anmelden</c-common.button>
        </form>
    </main>
</c-common.layout>
