<c-common.layout>
    <div class="flex min-h-screen max-lg:flex-col">
        <c-person.sidebar :person_list="person_list" />
        <main class="flex-1 px-8 py-16">
            <p class="text-lg">Ein Stammbaum, in dem jede Angabe ihren Beleg hat.</p>
            <form method="post" action="{% url 'common:logout-view' %}" class="mt-10">
                {% csrf_token %}
                <c-common.button type="submit">Abmelden</c-common.button>
            </form>
        </main>
    </div>
</c-common.layout>
