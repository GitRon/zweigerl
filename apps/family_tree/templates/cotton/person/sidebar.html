<c-vars person_list />
{# The sidebar beside the tree: the word mark, the search and every person (#10). The search field binds #}
{# "$search", and the server answers each pause in typing with the list patched anew. "type=search" #}
{# brings the browser's own clear button, which fires "input" like typing does. #}
<aside class="sticky top-0 flex h-screen w-80 shrink-0 flex-col gap-4 border-r border-card-edge px-4 py-6 max-lg:static max-lg:h-auto max-lg:w-full max-lg:border-r-0 max-lg:border-b" data-signals="{search: ''}">
    <c-common.wordmark class="text-4xl" />
    <input type="search" aria-label="Personen suchen" placeholder="Personen suchen…" autocomplete="off" class="min-h-11 w-full rounded-md border-[1.5px] border-ink bg-sheet px-3" data-bind="search" data-on:input__debounce.300ms="@get('{% url 'family_tree:person-search-view' %}')">
    <c-person.list :person_list="person_list" />
</aside>
